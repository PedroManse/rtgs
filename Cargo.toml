[package]
name = "rtgs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
libloading = "0.9.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "warn"
